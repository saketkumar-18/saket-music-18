<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="description" content="Saket Music 18 — free full-length music streaming. Millions of tracks, always current. No account, no ads." />
  <title>Saket Music 18 — Free Music Streaming</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/favicon-64.png" sizes="64x64" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- ============ sidebar ============ -->
    <aside id="sidebar">
      <a class="brand" href="#/home" data-nav="home">
        <span class="brand-mark">SM<span class="brand-18">18</span></span>
        <span class="brand-name">Saket&nbsp;Music</span>
      </a>

      <nav class="side-nav">
        <a href="#/home" data-nav="home" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 3 4 9.2V21h5.6v-6.4h4.8V21H20V9.2L12 3z"/></svg>Home</a>
        <a href="#/search" data-nav="search" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg>Search</a>
        <a href="#/library" data-nav="library" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M4 4h3v16H4V4zm6 0h3v16h-3V4zm7.4.2 2.9 15.4-2.9.55L14.5 4.75l2.9-.55z"/></svg>Your Library</a>
      </nav>

      <div class="library-box">
        <div class="library-head">
          <span>Your Library</span>
          <button id="btn-new-playlist" class="icon-btn" title="Create playlist">
            <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
          </button>
        </div>
        <div id="side-lists" class="side-lists"></div>
      </div>

      <div class="side-foot">Free forever · powered by the live JioSaavn catalog</div>
    </aside>

    <!-- ============ main ============ -->
    <main id="main">
      <header id="topbar">
        <div class="topbar-nav">
          <button id="btn-back" class="icon-btn round" title="Back">
            <svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5 1.4-1.4L10.8 12l6.1-6.1z"/></svg>
          </button>
          <button id="btn-fwd" class="icon-btn round dim" title="Forward">
            <svg viewBox="0 0 24 24"><path d="M8.5 4.5 16 12l-7.5 7.5-1.4-1.4L13.2 12 7.1 5.9z"/></svg>
          </button>
        </div>
        <div class="topbar-search">
          <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg>
          <input id="search-input" type="search" placeholder="What do you want to play?" autocomplete="off" spellcheck="false" />
          <button id="search-clear" class="icon-btn dim" title="Clear" hidden>
            <svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
          </button>
        </div>
        <a id="install-btn" class="pill-btn" href="#" hidden>Install app</a>
      </header>

      <div id="view" class="view" tabindex="-1"></div>
    </main>

    <!-- ============ player bar ============ -->
    <footer id="player">
      <div class="np-left">
        <img id="np-art" src="/icons/favicon-64.png" alt="" />
        <div class="np-meta">
          <a id="np-title" class="np-title" href="#">Nothing playing</a>
          <a id="np-sub" class="np-sub" href="#">&nbsp;</a>
        </div>
        <button id="np-like" class="icon-btn like" title="Save to Favorites">
          <svg class="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-10-9.3C.3 8 2.3 4.5 5.7 4.5c2 0 3.4 1.1 4.3 2.3l2 2.6 2-2.6c.9-1.2 2.3-2.3 4.3-2.3 3.4 0 5.4 3.5 3.7 7.2C19.5 16.3 12 21 12 21z" transform="scale(.92) translate(1,0)"/></svg>
        </button>
      </div>

      <div class="np-center">
        <div class="np-controls">
          <button id="pl-shuffle" class="icon-btn" title="Shuffle">
            <svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.6-1.6L15 10 13.6 8.6 17.4 5 16 3.6 17 3zM3 6h3.5c1.2 0 2.3.5 3 1.5l7.5 9c.5.6 1.1 1 1.9 1H21l-1.5 2H16c-1.2 0-2.3-.5-3-1.5l-7.5-9C5 7.9 4.4 7.5 3.6 7.5H3V6zm0 11h4l2-2.5 1.4 1.7-1.4 1.7c-.7.9-1.8 1.6-3 1.6H3v-2.5zM21 17l-2.3-2.8-1.4 1.4L21 19.4V17z"/></svg>
          </button>
          <button id="pl-prev" class="icon-btn" title="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6V5zm3.5 7L20 5v14L9.5 12z"/></svg>
          </button>
          <button id="pl-play" class="icon-btn play-main" title="Play / Pause (Space)">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7V5zm6 0h4v14h-4V5z"/></svg>
          </button>
          <button id="pl-next" class="icon-btn" title="Next">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2V5zM4 5l10.5 7L4 19V5z"/></svg>
          </button>
          <button id="pl-repeat" class="icon-btn" title="Repeat">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v-3l4 4-4 4v-3H9v3H7v-5zm10 10H7v3l-4-4 4-4v3h8v-3h2v5z"/></svg>
          </button>
        </div>
        <div class="np-seek">
          <span id="np-cur">0:00</span>
          <div id="seek" class="seekbar"><div id="seek-fill" class="seek-fill"></div><div id="seek-knob" class="seek-knob" hidden></div></div>
          <span id="np-dur">0:00</span>
        </div>
      </div>

      <div class="np-right">
        <button id="pl-queue" class="icon-btn" title="Queue">
          <svg viewBox="0 0 24 24"><path d="M4 6h12v2H4V6zm0 5h12v2H4v-2zm0 5h8v2H4v-2zm14 .2V14l6 3.5-6 3.5v-2.3z" transform="scale(.9) translate(1.3,0)"/></svg>
        </button>
        <button id="pl-vol" class="icon-btn" title="Mute">
          <svg class="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c3 .9 5 3.5 5 6.7s-2 5.8-5 6.7v2.1c4.1-1 7-4.6 7-8.8s-2.9-7.8-7-8.8z"/></svg>
          <svg class="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm16.2 3 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1-2.1-2.1 1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4z"/></svg>
        </button>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1" title="Volume" />
      </div>

      <audio id="audio" preload="auto"></audio>
    </footer>

    <!-- mobile bottom nav -->
    <nav id="mobile-nav">
      <a href="#/home" data-nav="home">
        <svg viewBox="0 0 24 24"><path d="M12 3 4 9.2V21h5.6v-6.4h4.8V21H20V9.2L12 3z"/></svg>Home</a>
      <a href="#/search" data-nav="search">
        <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg>Search</a>
      <a href="#/library" data-nav="library">
        <svg viewBox="0 0 24 24"><path d="M4 4h3v16H4V4zm6 0h3v16h-3V4zm7.4.2 2.9 15.4-2.9.55L14.5 4.75l2.9-.55z"/></svg>Library</a>
    </nav>

    <!-- queue drawer -->
    <div id="queue-drawer" hidden>
      <div class="qd-head">
        <span>Queue</span>
        <button id="qd-close" class="icon-btn" title="Close">
          <svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
        </button>
      </div>
      <div id="qd-list" class="qd-list"></div>
    </div>

    <!-- toast -->
    <div id="toast" hidden></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
