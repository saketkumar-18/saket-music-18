name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Live integration tests (upstream API)
        run: npm run test:live
        continue-on-error: true # upstream flakiness shouldn't fail the build
